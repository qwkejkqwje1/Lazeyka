[workspace]
members = [".", "core"]
resolver = "3"

[package]
name = "lazeyka"
version = "0.6.1"
edition = "2024"
description = "Лазейка — лёгкий VPN-клиент: сканер бесплатных серверов, раздельное туннелирование, AmneziaWG/WireGuard/VLESS/Hysteria2"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
lazeyka-core = { path = "core" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-winit-software", "software-renderer-systemfonts", "system-tray", "unstable-winit-030"] }
tokio = { version = "1.54", features = ["rt", "net", "io-util", "time", "process", "sync", "macros", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Time", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_Ole", "Win32_Graphics_Gdi"] }

[features]
# development: off-screen UI driven by a command file (see src/headless.rs)
headless = []

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
