[package]
name = "lazeyka-core"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
tokio = { version = "1.54", features = ["rt", "net", "io-util", "time", "process", "sync", "macros", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
base64 = "0.22"
percent-encoding = "2"
flate2 = "1"
maxminddb = { version = "0.32", features = ["mmap"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.9"
sha2 = "0.10"
anyhow = "1"
url = "2"
memmap2 = "0.9"
webpki-roots = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_JobObjects"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt", "macros", "rt-multi-thread", "signal"] }
